<!doctype html>
<!--
  Side panel document (spec.md §8.3, spec-addendum A7e / A11 / A15).

  `data-theme` starts at "dark" so there is no light flash before the bootstrap
  resolves the real theme; `data-columns` starts at "1" (and `data-layout`, the
  family it implies, at "list") because one column is the default in
  `settings-schema.js`. All three are rewritten by `applySettingsAttrs()` a few
  milliseconds later.

  MV3 CSP: no inline <script>, no inline event handlers, no external resources.
-->
<html data-theme="dark" data-columns="1" data-layout="list" data-thumbs="on" data-side="unknown">
<head>
  <meta charset="utf-8">
  <title data-i18n="extName"></title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>

<!-- Inline icon sprite (spec.md §8.3, P2 graft): identical on every OS, no network. -->
<svg class="sprite" hidden aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-close" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <path d="M4.2 4.2 11.8 11.8M11.8 4.2 4.2 11.8"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <path d="M8 3.2v9.6M3.2 8h9.6"/>
  </symbol>
  <symbol id="i-trash" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.8 4.4h10.4M6.4 4.4V2.9h3.2v1.5M4.4 4.4l.55 8.1a1 1 0 0 0 1 .93h4.1a1 1 0 0 0 1-.93l.55-8.1M6.6 6.8v4.4M9.4 6.8v4.4"/>
  </symbol>
  <!-- Settings. A FILLED gear, not a ring with spokes: the stroked version this replaces
       was read as a brightness control at 16 px, because eight thin rays around a small
       circle is what a sun icon is. Solid teeth and a large hub survive the size. -->
  <symbol id="i-gear" viewBox="0 0 24 24">
    <path d="M8.93 4.40L9.44 0.89L14.56 0.89L15.07 4.40A8.20 8.20 0 0 1 15.20 4.45L15.20 4.45L18.04 2.33L21.67 5.96L19.55 8.80A8.20 8.20 0 0 1 19.60 8.93L19.60 8.93L23.11 9.44L23.11 14.56L19.60 15.07A8.20 8.20 0 0 1 19.55 15.20L19.55 15.20L21.67 18.04L18.04 21.67L15.20 19.55A8.20 8.20 0 0 1 15.07 19.60L15.07 19.60L14.56 23.11L9.44 23.11L8.93 19.60A8.20 8.20 0 0 1 8.80 19.55L8.80 19.55L5.96 21.67L2.33 18.04L4.45 15.20A8.20 8.20 0 0 1 4.40 15.07L4.40 15.07L0.89 14.56L0.89 9.44L4.40 8.93A8.20 8.20 0 0 1 4.45 8.80L4.45 8.80L2.33 5.96L5.96 2.33L8.80 4.45A8.20 8.20 0 0 1 8.93 4.40ZM7.80 12.00A4.20 4.20 0 1 0 16.20 12.00A4.20 4.20 0 1 0 7.80 12.00Z" fill="currentColor" fill-rule="evenodd"/>
  </symbol>
  <symbol id="i-search" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <circle cx="7" cy="7" r="4.2"/>
    <path d="M10.2 10.2 13.6 13.6"/>
  </symbol>
  <symbol id="i-audio" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6.1h2.1L8 3.4v9.2L5.1 9.9H3z"/>
    <path d="M10.4 6.2a2.7 2.7 0 0 1 0 3.6M12.3 4.5a5.2 5.2 0 0 1 0 7"/>
  </symbol>
  <symbol id="i-muted" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6.1h2.1L8 3.4v9.2L5.1 9.9H3z"/>
    <path d="M10.6 6.4 13.6 9.6M13.6 6.4 10.6 9.6"/>
  </symbol>
  <symbol id="i-lock" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.4" y="7" width="9.2" height="6.3" rx="1.3"/>
    <path d="M5.7 7V5.6a2.3 2.3 0 0 1 4.6 0V7"/>
  </symbol>
  <symbol id="i-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3.8 10.4 8 6 12.2"/>
  </symbol>
  <symbol id="i-globe" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="5.6"/>
    <path d="M2.4 8h11.2M8 2.4c1.9 2.1 1.9 9.1 0 11.2M8 2.4c-1.9 2.1-1.9 9.1 0 11.2"/>
  </symbol>
  <symbol id="i-pin" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.1 2.4h3.8l-.5 3.3 2.2 2v1.1H4.4V7.7l2.2-2z"/>
    <path d="M8 8.8v4.8"/>
  </symbol>
  <symbol id="i-popout" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round">
  <path d="M9.5 2.5h4v4"/><path d="M13.5 2.5 8 8"/>
  <path d="M12 9.5v3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3"/>
</symbol>
<symbol id="i-window" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.4" y="3.4" width="11.2" height="9.2" rx="1.5"/>
    <path d="M2.4 6.3h11.2"/>
  </symbol>
  <symbol id="i-refresh" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13.1 8a5.1 5.1 0 1 1-1.6-3.7"/>
    <path d="M13.4 2.4v3.2h-3.2"/>
  </symbol>
  <!-- The side column. `i-bookmark` and `i-folder` belong to the bookmark rail; the
       rest are the tool strip's, one per tool, drawn in the same 16 px stroked style
       as everything above so a row of them reads as one set. `i-tool` is both the
       strip's "put the tools back in the column" toggle and the glyph any future
       widget gets when it declares no `iconId` of its own. -->
  <!-- The side column itself: a panel with its right-hand strip marked off. The topbar
       toggle changes WHAT IS IN that strip, so the strip is the thing to draw — a second
       ribbon there would sit 14 px above the column's own ribbon button and mean
       something else. -->
  <symbol id="i-sidecolumn" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.2" y="3.2" width="11.6" height="9.6" rx="1.5"/>
    <path d="M9.9 3.2v9.6"/>
  </symbol>
  <symbol id="i-bookmark" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.2 3.4a1 1 0 0 1 1-1h5.6a1 1 0 0 1 1 1v10L8 10.9 4.2 13.4z"/>
  </symbol>
  <symbol id="i-folder" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.4 4.4a1 1 0 0 1 1-1h2.6l1.4 1.6h5.2a1 1 0 0 1 1 1v5.6a1 1 0 0 1-1 1H3.4a1 1 0 0 1-1-1z"/>
  </symbol>
  <symbol id="i-layers" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 2.4 14 5.4 8 8.4 2 5.4z"/>
    <path d="M2.6 8.2 8 10.9l5.4-2.7"/>
    <path d="M2.6 11 8 13.7 13.4 11"/>
  </symbol>
  <symbol id="i-clock" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="5.6"/>
    <path d="M8 4.6V8l2.4 1.5"/>
  </symbol>
  <symbol id="i-wand" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.8 13.2 9.4 6.6"/>
    <path d="M11.4 2.2l.75 1.75 1.75.75-1.75.75-.75 1.75-.75-1.75-1.75-.75 1.75-.75z"/>
    <path d="M4.4 3.2v1.8M3.5 4.1h1.8"/>
  </symbol>
  <symbol id="i-copies" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.6" y="5.6" width="7.8" height="7.8" rx="1.2"/>
    <path d="M5.6 5.6V3.8a1.2 1.2 0 0 1 1.2-1.2h5.4a1.2 1.2 0 0 1 1.2 1.2v5.4a1.2 1.2 0 0 1-1.2 1.2h-1.8"/>
  </symbol>
  <symbol id="i-hourglass" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.6 2.6h6.8M4.6 13.4h6.8"/>
    <path d="M5.6 2.6v2.1L8 7.3l2.4-2.6V2.6"/>
    <path d="M5.6 13.4v-2.1L8 8.7l2.4 2.6v2.1"/>
  </symbol>
  <symbol id="i-list" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.6 4.4h7.8M5.6 8h7.8M5.6 11.6h7.8"/>
    <path d="M2.8 4.4h.01M2.8 8h.01M2.8 11.6h.01"/>
  </symbol>
  <symbol id="i-note" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.2" y="2.6" width="9.6" height="10.8" rx="1.1"/>
    <path d="M5.6 5.8h4.8M5.6 8.4h4.8M5.6 11h2.6"/>
  </symbol>
  <symbol id="i-tool" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.6 5h5.1M11.9 5h1.5M2.6 11h1.5M8.3 11h5.1"/>
    <circle cx="9.8" cy="5" r="1.5"/>
    <circle cx="6.2" cy="11" r="1.5"/>
  </symbol>
</svg>

<header class="topbar" id="topbar">
  <div class="search" data-testid="search">
    <svg class="search__icon icon" aria-hidden="true"><use href="#i-search"></use></svg>
    <input id="search-input" data-testid="search-input" type="search" autocomplete="off" spellcheck="false"
           data-i18n-attr="placeholder:searchPlaceholder;aria-label:searchPlaceholder">
    <button id="search-clear" class="iconbtn" type="button" hidden
            data-i18n-attr="aria-label:clearSearch;title:clearSearch"><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
  </div>
  <!-- The one control this feature is about. Burying it in the drawer meant nobody
       found it; here it is one press either way, and `aria-pressed` says which way
       the column is currently set. -->
  <button id="btn-rail-mode" class="iconbtn" type="button" data-testid="rail-mode-button" aria-pressed="false"
          data-i18n-attr="aria-label:railModeButton"><svg class="icon" aria-hidden="true"><use href="#i-sidecolumn"></use></svg></button>
  <button id="btn-settings" class="iconbtn" type="button" data-testid="settings-button" aria-haspopup="dialog" aria-expanded="false"
          data-i18n-attr="aria-label:settings;title:settings"><svg class="icon" aria-hidden="true"><use href="#i-gear"></use></svg></button>
</header>

<div id="hint-banner" class="hint" hidden data-testid="hint-banner">
  <p data-i18n="sidePositionHint"></p>
  <div class="hint__actions">
    <button id="hint-open-settings" class="btn" type="button" data-i18n="sidePositionOpenSettings"></button>
  </div>
  <button id="hint-dismiss" class="iconbtn hint__dismiss" type="button"
          data-i18n-attr="aria-label:dismiss;title:dismiss"><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
</div>

<div id="policy-banner" class="hint hint--warn" hidden data-testid="policy-banner">
  <p data-i18n="bannerScreenshotsDisabled"></p>
</div>

<div id="host-access-banner" class="hint hint--warn" hidden data-testid="host-access-banner">
  <p data-i18n="bannerSiteAccess"></p>
  <div class="hint__actions">
    <button id="host-access-open" class="btn" type="button" data-i18n="bannerSiteAccessOpen"></button>
  </div>
  <button id="host-access-dismiss" class="iconbtn hint__dismiss" type="button"
          data-i18n-attr="aria-label:dismiss;title:dismiss"><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
</div>

<section id="pinned" class="pinned" role="listbox" data-testid="pinned-grid" data-drop-zone="pinned"
         data-i18n-attr="aria-label:pinnedTabs" hidden></section>

<!-- The tab list and the side column share the row. The column is one of two rails,
     never both: `#widget-rail` holds the tools and `#bookmark-rail` the bookmarks, and
     `settings.railMode` picks which. They are SIBLINGS rather than one rail with two
     contents because `widgets.js` owns `#widget-rail` outright — it empties it on
     `destroy()`, hides it whenever its list is empty, and appends to reorder — so
     anything else living inside it would be swept away by a code path that has no
     idea it is there. `#tablist` keeps its id, class and role so nothing that
     addresses it has to know the row exists. -->
<div id="main-row" class="main-row">
  <main id="tablist" class="tablist" role="listbox" aria-multiselectable="true" data-drop-zone="list"
        data-i18n-attr="aria-label:tabs" tabindex="-1"></main>
  <aside id="widget-rail" class="rail" data-testid="widget-rail"
         data-i18n-attr="aria-label:widgets" hidden></aside>
  <aside id="bookmark-rail" class="rail rail--bookmarks" data-testid="bookmark-rail"
         data-i18n-attr="aria-label:bookmarks" hidden></aside>
</div>

<!-- Matches from OTHER windows. Present only while a search is running, and never
     merged into the tab list: those tabs are not in this window's model, and the
     list, the keyboard map and drag-and-drop all assume that they are. -->
<section id="other-windows" class="otherwin" hidden data-testid="other-windows"
         data-i18n-attr="aria-label:otherWindows">
  <h2 class="otherwin__heading">
    <span data-i18n="otherWindows"></span>
    <span class="otherwin__count" data-testid="other-windows-count"></span>
  </h2>
  <div class="otherwin__list"></div>
</section>

<div id="search-empty" class="empty" hidden data-i18n="searchNoResults"></div>

<!-- Where the tools go when the side column is showing bookmarks: one button per
     enabled tool, in `settings.widgets` order, each opening its tool in `#tool-sheet`.
     Hidden — and therefore costing no height at all — whenever the column is showing
     the tools themselves, which is every install that has not asked for bookmarks. -->
<nav id="tool-strip" class="toolstrip" data-testid="tool-strip"
     data-i18n-attr="aria-label:toolStrip" hidden></nav>

<footer class="bottombar">
  <button id="btn-new-tab" class="iconbtn" type="button" data-testid="new-tab-button"
          data-i18n-attr="aria-label:newTab;title:newTabTooltip"><svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg></button>
  <button id="btn-popout" class="iconbtn" type="button" data-testid="popout-button"
          data-i18n-attr="aria-label:popOut;title:popOutTooltip"><svg class="icon" aria-hidden="true"><use href="#i-popout"></use></svg></button>
  <span id="search-count" class="count" hidden aria-live="polite"></span>
  <button id="btn-trash" class="iconbtn" type="button" data-testid="trash-button" aria-haspopup="true" aria-expanded="false"
          data-i18n-attr="aria-label:closedTabs;title:closedTabs"><svg class="icon" aria-hidden="true"><use href="#i-trash"></use></svg><span class="badge" id="trash-badge" hidden></span></button>
</footer>

<div id="drop-indicator" class="drop-indicator" hidden></div>
<div id="context-menu" class="menu" role="menu" hidden data-testid="context-menu"></div>

<!-- The command palette (Ctrl/Cmd+Shift+P). Ctrl+K already focuses the search box. -->
<div id="palette" class="palette" hidden data-testid="palette">
  <div class="palette__box" role="dialog" aria-modal="true" data-i18n-attr="aria-label:cmdPalette">
    <input id="palette-input" class="palette__input" type="text" autocomplete="off" spellcheck="false"
           data-testid="palette-input" data-i18n-attr="placeholder:cmdPalettePlaceholder;aria-label:cmdPalette">
    <div class="palette__list" role="listbox" data-testid="palette-list"></div>
    <div class="palette__empty" hidden data-i18n="cmdPaletteEmpty" data-testid="palette-empty"></div>
  </div>
</div>
<div id="trash-popover" class="popover" role="dialog" hidden data-testid="trash-popover" data-i18n-attr="aria-label:closedTabs"></div>
<!-- One tool at a time, mounted by `tool-strip.js` and anchored to the strip button
     that opened it. Its `aria-label` is that tool's own heading, written on open. -->
<div id="tool-sheet" class="popover popover--sheet" role="dialog" hidden data-testid="tool-sheet" data-i18n-attr="aria-label:toolStrip"></div>
<aside id="settings-view" class="drawer" role="dialog" hidden data-testid="settings-view" data-i18n-attr="aria-label:settings"></aside>
<div id="confirm-bar" class="confirm" hidden data-testid="confirm-bar"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<template id="tpl-card">
  <article class="tab-card" role="option" aria-selected="false" draggable="true" tabindex="-1" data-testid="tab-card">
    <div class="card-head">
      <span class="unread-dot" aria-hidden="true"></span>
      <img class="favicon" alt="" draggable="false" width="16" height="16">
      <svg class="favicon-fallback icon" aria-hidden="true" hidden><use href="#i-globe"></use></svg>
      <span class="sr-only unread-label" data-i18n="unreadTab" hidden></span>
      <span class="spinner" aria-hidden="true"></span>
      <span class="pin-badge" aria-hidden="true" hidden><svg class="icon"><use href="#i-pin"></use></svg></span>
      <span class="lock-badge" data-testid="lock-badge" hidden><svg class="icon" aria-hidden="true"><use href="#i-lock"></use></svg></span>
      <span class="title"></span>
      <button class="audio iconbtn" type="button" data-testid="audio-button" tabindex="-1" hidden><svg class="icon" aria-hidden="true"><use href="#i-audio"></use></svg></button>
      <button class="close iconbtn" type="button" data-testid="close-button" tabindex="-1"
              data-i18n-attr="aria-label:closeTab;title:closeTab"><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
    </div>
    <div class="thumb thumb--empty" data-testid="thumb">
      <img class="thumb__img" alt="" draggable="false" decoding="async" data-testid="thumb-img" hidden>
      <span class="thumb__placeholder" aria-hidden="true">
        <img class="thumb__favicon" alt="" draggable="false" hidden>
        <svg class="thumb__glyph icon" aria-hidden="true" hidden><use href="#i-lock"></use></svg>
        <span class="thumb__label"></span>
      </span>
    </div>
  </article>
</template>

<template id="tpl-group">
  <section class="group" role="group" data-testid="group">
    <header class="group-header" data-testid="group-header" tabindex="-1" draggable="true">
      <button class="group-toggle iconbtn" type="button" tabindex="-1" aria-expanded="true"><svg class="icon" aria-hidden="true"><use href="#i-chevron"></use></svg></button>
      <span class="group-swatch" role="button" tabindex="0"></span>
      <span class="group-title"></span>
      <span class="group-count"></span>
    </header>
    <div class="group-body" data-drop-zone="group"></div>
  </section>
</template>

<template id="tpl-pinned">
  <button class="pinned-tile" type="button" role="option" aria-selected="false" tabindex="-1" draggable="true" data-testid="pinned-tile">
    <img class="favicon" alt="" draggable="false" width="16" height="16">
    <svg class="favicon-fallback icon" aria-hidden="true" hidden><use href="#i-globe"></use></svg>
    <span class="unread-dot" aria-hidden="true"></span>
  </button>
</template>

<script type="module" src="sidepanel.js"></script>
</body>
</html>
